<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      height: 100%;
      font-family: 'Arial', sans-serif;
      color: #fff;
      scroll-behavior: smooth;
    }
    body {
      background: url('Imgs/grunge-noise-texture-8.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    header {
      text-align: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.7);
    }
    header h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 0.1rem;
    }
    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    nav ul li a {
      text-decoration: none;
      color: #fff;
      font-size: 1.2rem;
      transition: color 0.3s;
    }
    nav ul li a:hover {
      color: #ff6347;
    }
    section {
      padding: 4rem 2rem;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="#about">About Me</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#running">Running</a></li>
      </ul>
    </nav>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <div style="width: 150px; height: 150px; border-radius: 50%; overflow: hidden; margin: auto;">
      <img src="Imgs/my-photo.jpg" alt="My Photo" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <p>Details about yourself go here.</p>
  </section>

  <section id="portfolio">
    <h2>Portfolio</h2>
    <div style="display: flex; justify-content: center; gap: 1rem;">
      <div style="width: 200px; height: 200px; background: rgba(255, 255, 255, 0.1); border: 1px solid #fff;">
        <p>Project 1</p>
      </div>
      <div style="width: 200px; height: 200px; background: rgba(255, 255, 255, 0.1); border: 1px solid #fff;">
        <p>Project 2</p>
      </div>
      <div style="width: 200px; height: 200px; background: rgba(255, 255, 255, 0.1); border: 1px solid #fff;">
        <p>Project 3</p>
      </div>
    </div>
  </section>

  <section id="running">
    <h2>Running</h2>
    <p>Share your running experiences and achievements here.</p>
  </section>

  <footer>
    <p>&copy; 2025 Your Name</p>
  </footer>
</body>
</html>
